// Sparkplug B payload schema, written for this project from the payload
// structure documented in the Sparkplug B v3.0.0 specification (Eclipse
// Foundation). Field names and numbers are interface facts taken from the
// specification text. No file from Eclipse Tahu or any other implementation
// was copied or consulted.
//
// Scope: this file models the parts of the payload this pipeline reads and
// writes (payload header, metrics with scalar values, metric metadata and
// property sets). Metrics that carry DataSet, Template or extension values
// still decode: protobuf keeps the unknown fields, and the ingest service
// dead-letters them because they carry no value it can store.

syntax = "proto2";

package sparkplug_pipeline.spb;

// Metric and property data types (specification section "Datatypes").
enum DataType {
  Unknown = 0;
  Int8 = 1;
  Int16 = 2;
  Int32 = 3;
  Int64 = 4;
  UInt8 = 5;
  UInt16 = 6;
  UInt32 = 7;
  UInt64 = 8;
  Float = 9;
  Double = 10;
  Boolean = 11;
  String = 12;
  DateTime = 13;
  Text = 14;
  UUID = 15;
  DataSet = 16;
  Bytes = 17;
  File = 18;
  Template = 19;
  PropertySet = 20;
  PropertySetList = 21;
}

message Payload {
  message MetaData {
    optional bool is_multi_part = 1;
    optional string content_type = 2;
    optional uint64 size = 3;
    optional uint64 seq = 4;
    optional string file_name = 5;
    optional string file_type = 6;
    optional string md5 = 7;
    optional string description = 8;
  }

  message PropertyValue {
    optional uint32 type = 1;
    optional bool is_null = 2;
    oneof value {
      uint32 int_value = 3;
      uint64 long_value = 4;
      float float_value = 5;
      double double_value = 6;
      bool boolean_value = 7;
      string string_value = 8;
      PropertySet propertyset_value = 9;
      PropertySetList propertysets_value = 10;
    }
  }

  message PropertySet {
    repeated string keys = 1;
    repeated PropertyValue values = 2;
  }

  message PropertySetList {
    repeated PropertySet propertyset = 1;
  }

  message Metric {
    optional string name = 1;
    optional uint64 alias = 2;
    optional uint64 timestamp = 3;
    optional uint32 datatype = 4;
    optional bool is_historical = 5;
    optional bool is_transient = 6;
    optional bool is_null = 7;
    optional MetaData metadata = 8;
    optional PropertySet properties = 9;
    oneof value {
      uint32 int_value = 10;
      uint64 long_value = 11;
      float float_value = 12;
      double double_value = 13;
      bool boolean_value = 14;
      string string_value = 15;
      bytes bytes_value = 16;
    }
  }

  optional uint64 timestamp = 1;
  repeated Metric metrics = 2;
  optional uint64 seq = 3;
  optional string uuid = 4;
  optional bytes body = 5;
}
